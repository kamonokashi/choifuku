<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Study Review App</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="top-bar">
        <div>
          <p class="eyebrow">Study Review</p>
          <h1 id="todayLabel">今日</h1>
        </div>
        <div class="streak-pill" aria-label="ストリーク">
          <span aria-hidden="true">🔥</span>
          <strong id="streakCount">0日</strong>
        </div>
      </header>

      <main>
        <section id="homeView" class="view is-active" aria-labelledby="homeTitle">
          <div class="section-heading">
            <h2 id="homeTitle">今日の授業</h2>
            <p id="completionLabel">0 / 0</p>
          </div>
          <div id="lessonList" class="lesson-list"></div>
          <button id="addStudyButton" class="wide-button" type="button">＋ 自習を追加</button>
          <div id="studyPicker" class="study-picker" hidden></div>
        </section>

        <section id="historyView" class="view" aria-labelledby="historyTitle">
          <div class="section-heading">
            <h2 id="historyTitle">履歴</h2>
          </div>
          <div id="subjectFilters" class="filter-row" role="list"></div>
          <div id="historyList" class="history-list"></div>
        </section>

        <section id="settingsView" class="view" aria-labelledby="settingsTitle">
          <div class="section-heading">
            <h2 id="settingsTitle">設定</h2>
          </div>

          <form id="subjectForm" class="settings-block">
            <h3>科目登録</h3>
            <div class="form-grid">
              <label>
                <span>名前</span>
                <input id="subjectNameInput" type="text" placeholder="例：英語">
              </label>
              <label>
                <span>色</span>
                <input id="subjectColorInput" type="color" value="#6aa9ff">
              </label>
            </div>
            <button class="primary-button" type="submit">追加</button>
          </form>

          <div class="settings-block">
            <h3>登録済み科目</h3>
            <div id="subjectList" class="subject-list"></div>
          </div>

          <form id="scheduleForm" class="settings-block">
            <h3>時間割設定</h3>
            <div class="form-grid">
              <label>
                <span>曜日</span>
                <select id="dayInput"></select>
              </label>
              <label>
                <span>時限</span>
                <input id="periodInput" type="number" min="1" max="12" value="1">
              </label>
              <label>
                <span>科目</span>
                <select id="scheduleSubjectInput"></select>
              </label>
            </div>
            <button class="primary-button" type="submit">時間割に追加</button>
          </form>

          <div class="settings-block">
            <h3>現在の時間割</h3>
            <div id="scheduleList" class="schedule-list"></div>
          </div>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="メイン">
        <button class="nav-button is-active" type="button" data-view="homeView">ホーム</button>
        <button class="nav-button" type="button" data-view="historyView">履歴</button>
        <button class="nav-button" type="button" data-view="settingsView">設定</button>
      </nav>
    </div>

    <script src="script.js"></script>
  </body>
</html>
